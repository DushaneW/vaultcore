name: Bug report
description: Report reproducible incorrect behavior using public test data.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include private keys, real recovery phrases or wallet files. For vulnerabilities, follow SECURITY.md."
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands and public or synthetic fixtures only.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, operating system, rustc --version and cargo --version.
    validations:
      required: true
