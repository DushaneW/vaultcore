[package]
name = "vaultcore-crypto"
description = "Chain-agnostic cryptographic primitives for VaultCore: BIP-39 mnemonics and BIP-32 hierarchical deterministic key derivation."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
bip39 = { version = "3.0", default-features = false, features = ["std", "rand"] }
bip32 = { version = "0.5", default-features = false, features = ["secp256k1", "alloc", "std"] }
zeroize = "=1.9.0"
rand = "0.8"

[dev-dependencies]
hex = "0.4"
bs58 = { version = "0.5", features = ["check"] }
